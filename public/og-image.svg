<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Фон — void -->
  <rect width="1200" height="630" fill="#08090a"/>

  <!-- Тонкое acid-lime свечение в правом верхнем углу -->
  <defs>
    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#e4f222" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Hairline-рамка по периметру -->
  <rect x="24" y="24" width="1152" height="582" rx="16"
        fill="none" stroke="#23252a" stroke-width="1"/>

  <!-- ─────────── Верх: логотип artteam ─────────── -->
  <g transform="translate(80, 80)">
      <!-- Буква "a" — пропорции как на сайте (ширина 40, высота 48) -->
      <path d="M0 48 L20 6 L40 48"
            stroke="#ffffff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Acid-lime перекладина -->
      <path d="M11 33 H29"
            stroke="#e4f222" stroke-width="5" stroke-linecap="round"/>

      <!-- Acid-lime точка — под правым углом -->
      <circle cx="48" cy="48" r="4" fill="#e4f222"/>

      <!-- Wordmark -->
      <text x="64" y="40"
            font-family="Inter, -apple-system, system-ui, sans-serif"
            font-size="26" font-weight="600" letter-spacing="-1"
            fill="#ffffff">artteam</text>
      </g>

  <!-- ─────────── Центр: заголовок ─────────── -->
  <!-- Строка 1 -->
  <text x="80" y="300"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-2.5"
        fill="#ffffff">Собираю лендинги,</text>

  <!-- Строка 2 — приглушённая -->
  <text x="80" y="390"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-2.5"
        fill="#8a8f98">которые продают.</text>

  <!-- ─────────── Низ: метаданные ─────────── -->
  <!-- Стек -->
  <text x="80" y="500"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="20" font-weight="400" letter-spacing="-0.4"
        fill="#d0d6e0">React · TypeScript · Framer Motion · 3 года опыта</text>

  <!-- Domain — mono стиль -->
  <text x="80" y="560"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" font-weight="400" letter-spacing="-0.2"
        fill="#62666d">artteam-dev.ru</text>

  <!-- ─────────── Справа: acid-lime badge "100" ─────────── -->
  <g transform="translate(980, 80)">
    <rect x="0" y="0" width="140" height="140" rx="20"
          fill="none" stroke="#23252a" stroke-width="1"/>

    <text x="70" y="72"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="56" font-weight="600" letter-spacing="-2"
          fill="#e4f222" text-anchor="middle">100</text>
    <text x="70" y="106"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="400" letter-spacing="0.5"
          fill="#62666d" text-anchor="middle">LIGHTHOUSE</text>
  </g>

  <!-- ─────────── Справа-низ: badge "60+" ─────────── -->
  <g transform="translate(980, 240)">
    <rect x="0" y="0" width="140" height="140" rx="20"
          fill="none" stroke="#23252a" stroke-width="1"/>

    <text x="70" y="72"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="56" font-weight="600" letter-spacing="-2"
          fill="#ffffff" text-anchor="middle">12+</text>
    <text x="70" y="106"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="400" letter-spacing="0.5"
          fill="#62666d" text-anchor="middle">ПРОЕКТОВ</text>
  </g>

  <!-- ─────────── Справа-низ: acid-lime accent линия ─────────── -->
  <line x1="80" y1="580" x2="220" y2="580"
        stroke="#e4f222" stroke-width="3" stroke-linecap="round"/>
</svg>