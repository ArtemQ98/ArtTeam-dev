<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#08090a"/>

  <!-- subtle atmospheric glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e4f222" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark + wordmark -->
  <g transform="translate(80, 80)">
    <path d="M28 84 L48 20 L68 84" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M36 64 H60" stroke="#e4f222" stroke-width="8" stroke-linecap="round"/>
    <circle cx="76" cy="76" r="7" fill="#e4f222"/>

    <text x="100" y="72" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-1" fill="#ffffff">artteam</text>
  </g>

  <!-- headline -->
  <text x="80" y="360" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="88" font-weight="600" letter-spacing="-3" fill="#ffffff">Fullstack-разработчик,</text>
  <text x="80" y="456" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="88" font-weight="600" letter-spacing="-3" fill="#8a8f98">который делает</text>
  <text x="80" y="552" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="88" font-weight="600" letter-spacing="-3" fill="#e4f222">интерфейсы, которым доверяют.</text>

  <!-- bottom bar -->
  <text x="80" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#62666d">artteam.dev · React · TypeScript · Node · 6 лет</text>
</svg>